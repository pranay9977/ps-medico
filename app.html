<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS Medico — Indian medicine prices &amp; cheaper options</title>
<meta name="description" content="Search 40,000+ Indian medicines: MRP, salt, cheaper same-salt brands, Jan Aushadhi government prices, maker trust, banned/NSQ warnings. Works offline after first use.">
<meta name="theme-color" content="#0a5c3c">

<style>
:root{
  --g:#0a5c3c; --g2:#0e7a4e; --gsoft:#e7f4ee; --ink:#15201a; --mut:#5c6f64;
  --line:#dce8e1; --bg:#f4f8f5; --card:#ffffff;
  --amber:#9a6200; --amberbg:#fff4dd; --red:#b3261e; --redbg:#fdecea;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
     background:var(--bg); color:var(--ink); min-height:100vh}
button{font:inherit}

/* ---- header: the search box lives HERE and is never re-created ---- */
header{position:sticky; top:0; z-index:20; background:var(--g); padding:10px 12px 12px;
       display:flex; gap:8px; align-items:center; box-shadow:0 1px 8px rgba(0,0,0,.18)}
header .logo{width:34px; height:34px; flex:0 0 34px; border-radius:9px; background:#fff;
       display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--g); font-size:15px}
#q{flex:1; min-width:0; font-size:17px; padding:11px 14px; border-radius:12px; border:0;
   outline:0; background:#fff; color:var(--ink)}
#q::placeholder{color:#9ab0a4}
.hbtn{flex:0 0 auto; background:rgba(255,255,255,.16); color:#fff; border:0; border-radius:12px;
      padding:11px 12px; cursor:pointer; font-size:13px}
.hbtn:active{background:rgba(255,255,255,.3)}

/* ---- status chips row ---- */
#chips{display:flex; gap:6px; padding:8px 12px 0; flex-wrap:wrap; align-items:center}
.chip{font-size:12px; color:var(--mut); background:var(--card); border:1px solid var(--line);
      padding:4px 10px; border-radius:99px}
.chip.live{color:var(--g); border-color:var(--g2); cursor:pointer}
.chip.warn{color:var(--amber); background:var(--amberbg); border-color:#e8cf9d; cursor:pointer}
.chip.err{color:var(--red); background:var(--redbg)}

main{padding:10px 12px 90px; max-width:760px; margin:0 auto}

/* ---- result cards ---- */
.med{background:var(--card); border:1px solid var(--line); border-radius:14px;
     padding:12px 14px; margin:8px 0; cursor:pointer}
.med:active{background:var(--gsoft)}
.med .nm{font-weight:650; font-size:16.5px; text-transform:capitalize}
.med .sub{color:var(--mut); font-size:13.5px; margin-top:3px}
.med .row{display:flex; gap:8px; align-items:baseline; margin-top:7px; flex-wrap:wrap}
.med .price{font-weight:750; font-size:19px; color:var(--g)}
.med .old{color:var(--mut); text-decoration:line-through; font-size:13.5px}
.badge{font-size:11px; font-weight:650; padding:2px 8px; border-radius:99px; white-space:nowrap}
.badge.v{background:var(--gsoft); color:var(--g)}
.badge.s{background:var(--amberbg); color:var(--amber)}
.badge.upd{background:#e8f0fe; color:#1a4fa0}
.hint{font-size:12.5px; color:var(--mut); margin-top:6px}

/* ---- cards inside the detail view ---- */
.dcard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:10px 0}
.dcard h3{margin:0 0 6px; font-size:14px; text-transform:uppercase; letter-spacing:.4px; color:var(--mut)}
.dcard.jap{background:var(--gsoft); border-color:#bcd9ca}
.dcard.jap .big{font-size:22px; font-weight:800; color:var(--g)}
.dcard.alarm{background:var(--redbg); border-color:#eec4c1}
.dcard.alarm h3{color:var(--red)}
.dcard.nsqq{background:var(--amberbg); border-color:#e8cf9d}
.btn{display:inline-block; background:var(--g); color:#fff; border:0; border-radius:11px;
     padding:11px 16px; font-weight:650; cursor:pointer; font-size:15px; margin:4px 8px 4px 0}
.btn.ghost{background:var(--card); color:var(--g); border:1.5px solid var(--g2)}
.btn.amber{background:var(--amber)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.5}
.saltb{display:flex; justify-content:space-between; align-items:baseline; gap:10px; width:100%;
       text-align:left; background:var(--card); color:var(--ink); border:1px solid var(--line);
       border-radius:10px; padding:9px 12px; margin:4px 0; cursor:pointer; font-size:14.5px}
.saltb:active{background:var(--gsoft)}
.saltb .sp{font-weight:700; color:var(--g); white-space:nowrap}
.saltb .su{color:var(--mut); font-size:12px; white-space:nowrap}

/* ---- misc states ---- */
.note{background:var(--card); border:1px dashed var(--line); border-radius:14px;
      padding:14px; margin:8px 0; color:var(--mut); font-size:14.5px}
.note b{color:var(--ink)}
.spin{display:inline-block; width:14px; height:14px; border:2px solid var(--g2);
      border-top-color:transparent; border-radius:50%; animation:sp 1s linear infinite; vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.h1{font-size:21px; font-weight:800; margin:14px 0 4px}
.h2{font-size:14px; color:var(--mut); margin:0 0 10px}
.back{background:none; border:0; color:var(--g); font-weight:700; cursor:pointer; padding:6px 0; font-size:15px}
.adminrow{background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:12px; margin:8px 0; font-size:14.5px}
.adminrow .t{font-weight:650}
.adminrow .meta{color:var(--mut); font-size:12.5px; margin-top:2px}
.inp{width:100%; font-size:16px; padding:11px 12px; border-radius:11px;
     border:1.5px solid var(--line); outline:0}
.inp:focus{border-color:var(--g2)}
#toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#1c2b23;
       color:#fff; padding:11px 18px; border-radius:99px; font-size:14px; opacity:0;
       transition:opacity .25s; z-index:50; max-width:88vw; text-align:center}
#toast.on{opacity:.97}
.demo{background:var(--amberbg); color:var(--amber); border:1px solid #e8cf9d; border-radius:12px;
      padding:10px 12px; font-size:13.5px; margin:10px 0}
footer{color:var(--mut); font-size:12px; text-align:center; padding:20px 12px 30px}
a{color:var(--g)}
</style>

const CACHE = "psm-data-v1";
async function cacheGet(url){
  if (DEMO || !("caches" in window)) return null;
  try { const c = await caches.open(CACHE); return await c.match(url); } catch (e) { return null; }
}
async function cachePut(url, resp){
  if (DEMO || !("caches" in window)) return;
  try { const c = await caches.open(CACHE); await c.put(url, resp.clone()); } catch (e) {}
}
async function fetchChunk(letter, series, force){       // series: "v" | "s"
  if (!force && idx[series][letter]) return idx[series][letter];
  const url = API + (series === "v" ? "/idx/" : "/idx1/") + letter + ".json";
  let r = force ? null : await cacheGet(url);
  if (!r){
    if (!net()) return null;
    try { r = await fetch(url, force ? {cache: "reload"} : {}); } catch (e) { return null; }
    if (r && r.ok) await cachePut(url, r);
  }
  if (!r || !r.ok) return null;
  let j;
  try { j = await r.json(); } catch (e) { return null; }
  idx[series][letter] = j;
  Object.assign(legend[series], j.L || {});
  return j;
}
function lettersFor(qs){
  const toks = qs.toLowerCase().split(/\s+/).filter(Boolean);
  const out = [];
  for (const tk of toks.slice(0, 3)){
    const c = (tk.match(/[a-z]/) || [])[0];
    if (c && !out.includes(c)) out.push(c);
  }
  return out.length ? out : ["0"];
}
function tokens(qs){ return qs.toLowerCase().split(/\s+/).filter(Boolean); }

async function searchLocal(qs){
  const toks = tokens(qs);
  const ls = lettersFor(qs);
  const hits = [], seen = new Set();
  for (const series of ["v", "s"]){
    for (const g of ls){
      const ch = await fetchChunk(g, series);
      for (const e of (ch && ch.m) || []){
        if (seen.has(e.n)) continue;
        const hay = e.n + " " + e.k;
        let ok = true;
        for (const tk of toks) if (!hay.includes(tk)){ ok = false; break; }
        if (ok){ seen.add(e.n); hits.push(series === "v" ? Object.assign({src:"v"}, e)
                                                         : Object.assign({src:"s"}, e)); }
      }
    }
  }
  hits.sort((a, b) => ((a.n.indexOf(qs) === 0 ? 0 : 1) - (b.n.indexOf(qs) === 0 ? 0 : 1)) ||
                      (a.n.length - b.n.length));
  return hits;
}
/* medicines integrated through the live search behave like chunk entries */
function searchLive(qs){
  const toks = tokens(qs);
  const hits = [];
  for (const e of live.meds){
    const hay = e.n + " " + e.k;
    let ok = true;
    for (const tk of toks) if (!hay.includes(tk)){ ok = false; break; }
    if (ok) hits.push(Object.assign({}, e, {src: "s"}));
  }
  return hits;
}
/* channel price overrides: newest verified prices win over the chunk's price;
   a price this device fetched live (PharmEasy) wins over the stored price too */
function applyChan(e){
  const key = e.n + "|" + e.p;
  const hit = chan.prices.get(key) || chan.prices.get(e.n);
  if (hit){ e.old = e.r; e.r = hit.p; e.chan = true; e.chanA = hit.a; return e; }
  const lh = live.prices.get(key);
  if (lh && lh.p){ e.old = e.r; e.r = lh.p; e.liveA = lh.a; }
  return e;
}
async function loadChannel(){
  if (DEMO){ Object.assign(chan, DEMO_CHAN); chan.prices = new Map(DEMO_CHAN.prices); return; }
  const saved = localStorage.getItem("psmChan");
  if (saved){ try { const j = JSON.parse(saved);
    chan.dver = j.dver; chan.date = j.date;
    chan.prices = new Map(j.prices.map(p => [p.nm + "|" + p.pk, p])); } catch (e) {} }
  if (!net()) return;
  try {
    const r = await fetch(API + "/data", {cache: "no-store"});
    if (!r.ok) return;
    const j = await r.json();
    const arr = (j.prices || []).map(p => Array.isArray(p) ? {nm:p[0], pk:p[1], p:p[2], a:p[3]}
                                                           : {nm:p.nm, pk:p.pk, p:p.p, a:p.a});
    chan.dver = j.dver; chan.date = j.date || chan.date;
    chan.prices = new Map(arr.map(p => [p.nm + "|" + p.pk, p]));
    localStorage.setItem("psmChan", JSON.stringify({dver:j.dver, date:chan.date, prices:arr}));
  } catch (e) {}
}

function unitCount(pack){                    // "strip of 15 tablets" -> 15, "14's" -> 14
  const m = String(pack || "").match(/(\d+)\s*(?:'s|tab|cap|sachet|ml|tablet|capsule)/i) ||
            String(pack || "").match(/(\d+)/);
  return m ? +m[1] : null;
}
function japFor(e){
  if (!e.k) return null;
  let rows = JAP[e.k];
  if (!rows){                                 // try the first salt word ("paracetamol + ..." )
    const first = e.k.split(" ")[0];
    rows = JAP[first];
  }
  if (!rows || !rows.length) return null;
  let best = rows[0];
  const strengths = String(e.d || "").toLowerCase();
  for (const r of rows) if (strengths && r[3] && strengths.includes(String(r[3]).toLowerCase()))
    { best = r; break; }
  let save = null;
  const uc = unitCount(e.p), jc = unitCount(best[1]);
  if (uc && jc && e.r) save = Math.round((1 - (best[2] / jc) / (e.r / uc)) * 100);
  return {row: best, save: save};
}
function bannedFor(e){
  if (!e.k) return null;
  if (BANNED[e.k]) return BANNED[e.k];
  const parts = e.k.split(/\s*\+\s*/);
  for (const p of parts) if (BANNED[p]) return BANNED[p];
  return null;
}
/* ---- maker trust: scored only from international public records ---- */
const LEGAL_TAIL = new Set(["ltd","limited","pvt","private","llp","inc","co","corp","plc",
  "india","pharmaceuticals","pharmaceutical","pharma","laboratories","laboratory","labs",
  "healthcare","industries","enterprises","sciences","life","remedies","works","chemicals",
  "and","of","the","company","group"]);
function normMaker(s){
  const w = String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim().split(/\s+/)
    .filter(t => t.length > 1);          // drop stray initials ("pvt l", "reddy s")
  while (w.length > 1 && LEGAL_TAIL.has(w[w.length - 1])) w.pop();
  return w.join(" ");
}
const TRUST_BY_NORM = (() => {
  const m = new Map();
  for (const k of Object.keys(TRUST)){
    const n = normMaker(k);
    if (n && !m.has(n)) m.set(n, TRUST[k]);
  }
  return m;
})();
function trustFor(e){
  if (!e.m || !TRUST_BY_NORM.size) return null;
  const n = normMaker(e.m);
  if (!n) return null;
  if (TRUST_BY_NORM.has(n)) return TRUST_BY_NORM.get(n);
  for (const [k, v] of TRUST_BY_NORM){   // truncated names: "ranbaxy laboratories (sun ph…"
    if (k.length < 5) continue;
    if (n.startsWith(k + " ") || k.startsWith(n + " ")) return v;
  }
  return null;
}

function strengthKey(e){
  /* "Paracetamol (650mg)" -> "650mg" - composition first, name as fallback.

  const grab = s => (String(s || "").toLowerCase()
      .match(/\d+(?:\.\d+)?\s*(?:mg|mcg|gm|ml|iu|g|%)/g) || [])

    const b = {med: e.n, pack: e.p, price: $("rpPrice").value.trim(),
               shop: $("rpNote").value.trim(), note: ""};
    if (!b.price){ toast("type what you paid"); return; }
    $("rpSend").disabled = true;
    try {
      const r = await fetch(API + "/report", {method: "POST",
        headers: {"Content-Type": "application/json"}, body: JSON.stringify(b)});
      const j = await r.json();
      toast(j.ok ? "sent — thank you!" : (j.error || "failed"));
      if (j.ok) $("rp").innerHTML = "<b>Sent.</b> The owner sees it on their admin page.";
    } catch (err) { toast("offline — report not sent"); }
    $("rpSend").disabled = false;
  };
  if (e.k){                                 // fill the same-salt card once the index is in
    loadSaltIdx().then(() => {
      const box = $("saltbox"); if (!box || !box.isConnected) return;
      const cur = (e.n || "").toLowerCase();
      const list = (saltRowsFor(e) || []).filter(r => r[0].toLowerCase() !== cur).slice(0, 6);
      box.innerHTML = list.length ? list.map(r =>
        `<button class="saltb" data-s="${esc(r[0])}"><span>${esc(r[0])}</span>` +
        `<span><span class="sp">${rs(r[1])}</span>${r[2] ? ` <span class="su">${rs(Math.round(r[1] / r[2] * 100) / 100)}/unit</span>` : ""}</span></button>`).join("")
        : `<span class="hint">no other brand of this salt in the list yet</span>`;
      box.querySelectorAll(".saltb").forEach(b => b.onclick = () => {
        q.value = b.dataset.s;

    });
  }

}

/* ================= the internet import ================= */
async function findOnline(qs){
  main.innerHTML = `<div class="note"><span class="spin"></span>&nbsp; Searching the internet for “${esc(qs)}”…</div>`;
  let j = null;
  try {
    const r = await fetch(API + "/find?q=" + encodeURIComponent(qs), {cache: "no-store"});
    j = await r.json();
  } catch (e) {}
  if (!j || !j.ok){
    main.innerHTML = `<div class="note">Could not reach the online search${ONLINE ? "" : " — you appear to be offline"}.</div>` + webLinks(qs);
    return;
  }
  if (j.count){
    lettersFor(qs).forEach(g => fetchChunk(g, "s"));   // save for offline next time
    renderResults(j.results, qs, true);
    toast("found " + j.count + (j.count === 1 ? " medicine" : " medicines") + " online");
    liveCheck(qs);
  } else findLive(qs);
}
/* ================= the live layer (PharmEasy, through the server) =================
   /live?q= asks the server to check PharmEasy right now. It returns (a) fresh
   prices for medicines PS Medico already knows - merged like a price-channel
   update - and (b) whole medicines it does not know, which get integrated. */
async function callLive(qs){
  if (DEMO || !net()) return null;
  try {
    const r = await fetch(API + "/live?q=" + encodeURIComponent(qs), {cache: "no-store"});
    const j = await r.json();
    return (j && j.ok && !j.blocked) ? j : null;
  } catch (e) { return null; }
}
function liveAbsorb(j){
  let n = 0;
  for (const p of (j.prices || [])){
    live.prices.set(p.nm + "|" + p.pk, p);
    n++;
  }
  const have = new Set(live.meds.map(m => m.n + "|" + m.p));
  for (const m of (j.fresh || []))
    if (!have.has(m.n + "|" + m.p)){ live.meds.push(m); n++; }
  if (n) liveSave();
  return n;
}
let liveT = null, liveSeq = 0;
function liveCheck(qs){
  /* background freshness pass: if any shown card still carries a stored
     (not live-checked) price, quietly ask the server for today's price */
  clearTimeout(liveT);
  const stale = CURRENT.some(e => !e.chan && !e.liveA && e.src === "s" && e.s === "s100");
  if (!stale || !net()) return;
  const seq = ++liveSeq;
  liveT = setTimeout(async () => {
    const j = await callLive(qs);
    if (!j || seq !== liveSeq || q.value.trim() !== qs) return;   // user moved on
    if (liveAbsorb(j)) renderResults(CURRENT.map(e => Object.assign({}, e)), qs);
  }, 700);
}
async function findLive(qs){
  main.innerHTML = `<div class="note"><span class="spin"></span>&nbsp; Checking PharmEasy live for “${esc(qs)}”…</div>`;
  const j = await callLive(qs);
  if (!j || !(j.fresh || []).length){ main.innerHTML = notFoundHTML(qs); return; }
  liveAbsorb(j);
  const seen = new Set(live.meds.map(m => m.n));
  const rows = (j.fresh || []).filter(m => seen.has(m.n));
  renderResults(rows, qs, "live");
  toast("found " + rows.length + " live on PharmEasy — added to PS Medico");
}
async function reportMissing(name){
  if (DEMO){ toast("preview mode — reports are live from the real link"); return; }
  try {
    const r = await fetch(API + "/report", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({kind: "missing", med: name, note: "searched from the app"})});
    const j = await r.json();
    toast(j.ok ? "request sent — thank you!" : (j.error || "failed"));
  } catch (e) { toast("offline — try again with internet"); }
}

/* ================= search wiring (keyboard-safe by construction) ================= */
let searchT = null;
q.addEventListener("input", () => {
  clearTimeout(searchT);
  const qs = q.value.trim();
  if (!qs){ CURRENT = []; home(); return; }
  searchT = setTimeout(() => doSearch(qs), 130);
});
q.addEventListener("keydown", e => {
  if (e.key === "Enter"){ clearTimeout(searchT); doSearch(q.value.trim()); }
});
async function doSearch(qs){
  if (!qs) return;
  if (location.hash === "#admin") location.hash = "";
  main.innerHTML = `<div class="note"><span class="spin"></span>&nbsp; Searching${ONLINE ? "" : " saved data"}…</div>`;
  const local = await searchLocal(qs);
  const mine = searchLive(qs);                      // live-integrated medicines on this device
  const seenN = new Set(local.map(e => e.n));
  const hits = local.concat(mine.filter(e => !seenN.has(e.n)));
  if (hits.length){ renderResults(hits, qs); liveCheck(qs); return; }
  const anyChunk = lettersFor(qs).some(g => idx.v[g] || idx.s[g]);
  if (DEMO){ main.innerHTML = `<div class="note"><b>“${esc(qs)}” is not in the preview sample.</b><br>
    The live app searches 24,000+ medicines — open it from your PS Medico link.</div>`; return; }
  if (!ONLINE && anyChunk) main.innerHTML = notFoundHTML(qs) ;
  else if (!ONLINE) main.innerHTML = `<div class="note"><b>You are offline</b> and this letter of the
    database is not saved on this device yet. Reconnect once — after that it works offline.</div>`;
  else findOnline(qs);
}
main.addEventListener("click", e => {
  const card = e.target.closest(".med[data-i]");
  if (card){ detail(+card.dataset.i); return; }
  const miss = e.target.closest("[data-miss]");
  if (miss) reportMissing(miss.dataset.miss);
});

/* ================= home + chips ================= */
function home(){
  main.innerHTML = `
    <div class="h1">Indian medicine prices, always fresh</div>
    <div class="h2">${rs2(MEDCOUNT)} medicines · verified + community + PharmEasy live prices · works offline after first use</div>
    <div class="note">Type a name above — e.g. <b>dolo 650</b>, <b>shelcal</b>, <b>augmentin 625</b>, <b>evion</b>.
    If something is missing, the app searches the internet for it automatically.<br><br>
    🏛 green <b>Jan Aushadhi card</b> = what the same salts cost at government stores (often 50–90% less).<br>
    ≡ <b>Same-salt brands</b> = other branded makers of the same salt, cheapest per unit first.<br>
    🏭 <b>Maker check</b> = the maker's trust score from international public records (US FDA / WHO / EU); "not rated" means no such record exists — not a bad sign.<br>
    ⚠ red/amber warnings = banned combinations or quality alerts for that exact brand.</div>
    ${DEMO ? "" : `<div class="note" style="border-style:solid">New here? Everything you open gets saved on
    your device. Tap the ● Live chip for a manual refresh anytime.</div>`}`;
}
function rs2(n){ return Number(n).toLocaleString("en-IN"); }
function statusChips(){
  const saved = Object.keys(idx.v).length;
  const c = [];
  c.push(ONLINE ? `<span class="chip live" id="liveChip">● Live</span>` : `<span class="chip err">Offline — saved data</span>`);
  if (!DEMO) c.push(`<span class="chip">saved: ${saved}/26 letters</span>`);
  if (chan.date && !DEMO){
    const age = (Date.now() - new Date(chan.date).getTime()) / 86400000;
    c.push(age > 7 ? `<span class="chip warn" onclick="refreshData()">prices from ${esc(chan.date)} — refresh</span>`
                   : `<span class="chip">prices updated ${esc(chan.date)}</span>`);
  }
  chips.innerHTML = c.join("");
  const lc = $("liveChip"); if (lc) lc.onclick = refreshData;
}
async function refreshData(){
  toast("refreshing…");
  await loadChannel();
  downloadedAll = false;
  const letters = [...new Set([...Object.keys(idx.v), ...lettersFor(q.value || "d")])];
  for (const g of letters) await fetchChunk(g, "v", true);   // re-fetch, bypass cache
  const qs = q.value.trim();
  if (qs) doSearch(qs); else { home(); statusChips(); toast("up to date"); }
}
async function downloadAll(withSupp){
  if (downloadedAll && !withSupp) return;
  for (const g of "abcdefghijklmnopqrstuvwxyz"){
    await fetchChunk(g, "v");
    statusChips();
    await new Promise(r => setTimeout(r, 250));
  }
  if (withSupp) for (const g of "abcdefghijklmnopqrstuvwxyz0"){
    await fetchChunk(g, "s");
    await new Promise(r => setTimeout(r, 250));
  }
  downloadedAll = true;
  statusChips();
  toast("database saved on this device — works offline now");
}

async function adminLoad(k){
  const box = $("aReports");
  box.innerHTML = '<div class="t">Friends’ reports</div><div class="hint"><span class="spin"></span> loading…</div>';
  let j;
  try { j = await (await fetch(API + "/reports?key=" + encodeURIComponent(k))).json(); }
  catch (e) { box.innerHTML += "<div class='hint'>offline</div>"; return; }
  if (!j.ok){ box.innerHTML += "<div class='hint'>could not load</div>"; return; }
  const prices = j.reports.filter(x => x.kind !== "missing");
  const missing = j.reports.filter(x => x.kind === "missing");
  const row = (x, label) => `<div class="adminrow" style="margin:6px 0">
    <div class="t">${esc(x.med)}</div>
    <div class="meta">${esc([label, x.pack, x.price, x.shop].filter(Boolean).join(" · "))}</div>
    ${x.note ? `<div class="hint">${esc(x.note)}</div>` : ""}
    <button class="btn ghost" style="margin-top:8px;padding:7px 12px;font-size:13px"
      onclick="delReport('${esc(x.id)}')">Handled ✓</button></div>`;
  box.innerHTML = `<div class="t">Friends’ reports (${prices.length})</div>` +
    (prices.length ? prices.map(x => row(x, "wrong price")).join("") : "<div class='hint'>none right now</div>") +
    `<div class="t" style="margin-top:14px">Requested medicines (${missing.length})</div>` +
    (missing.length ? missing.map(x => row(x, "please add")).join("") :
      "<div class='hint'>none right now</div>");
}
async function delReport(id){
  try {
    await fetch(API + "/reports?key=" + encodeURIComponent(adminKey()) + "&del=" + encodeURIComponent(id));
    adminLoad(adminKey());
  } catch (e) { toast("failed"); }
}
$("adminBtn").onclick = () => { location.hash = location.hash === "#admin" ? "" : "#admin"; };
addEventListener("hashchange", route);
function route(){
  if (location.hash === "#admin") adminPage();
  else { const qs = q.value.trim(); qs ? doSearch(qs) : home(); }
  statusChips();
}

/* ================= boot ================= */
async function boot(first){
  liveLoad();                                        // live-integrated medicines + prices
  if (DEMO){ demoInit(); loadChannel(); home(); statusChips(); return; }
  if (first && "serviceWorker" in navigator && location.protocol === "https:")
    try { navigator.serviceWorker.register("app-sw.js"); } catch (e) {}
